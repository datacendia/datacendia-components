apiVersion: v1
kind: ConfigMap
metadata:
  name: datacendia-config
  namespace: datacendia
  labels:
    app.kubernetes.io/name: datacendia-config
    app.kubernetes.io/part-of: datacendia-platform
data:
  ollama-host: "http://ollama:11434"
  log-level: "info"
  node-env: "production"
  cors-origin: "https://app.datacendia.com"
  rate-limit-window: "60000"
  rate-limit-max: "100"
---
apiVersion: v1
kind: Secret
metadata:
  name: datacendia-secrets
  namespace: datacendia
  labels:
    app.kubernetes.io/name: datacendia-secrets
    app.kubernetes.io/part-of: datacendia-platform
type: Opaque
stringData:
  # Replace these with real values before deploying
  database-url: "postgresql://datacendia:CHANGE_ME@postgres:5432/datacendia?schema=public"
  jwt-secret: "CHANGE_ME_TO_RANDOM_64_CHAR_SECRET"
  redis-url: "redis://redis:6379"
  smtp-password: "CHANGE_ME"
  encryption-key: "CHANGE_ME_TO_RANDOM_32_BYTE_HEX"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: datacendia-uploads
  namespace: datacendia
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
