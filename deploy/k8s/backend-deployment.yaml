apiVersion: apps/v1
kind: Deployment
metadata:
  name: datacendia-backend
  namespace: datacendia
  labels:
    app.kubernetes.io/name: datacendia-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: datacendia-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: datacendia-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: datacendia-backend
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: datacendia-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: datacendia/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: datacendia-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: datacendia-secrets
                  key: jwt-secret
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: datacendia-secrets
                  key: redis-url
            - name: OLLAMA_HOST
              valueFrom:
                configMapKeyRef:
                  name: datacendia-config
                  key: ollama-host
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: datacendia-uploads
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: datacendia-backend
---
apiVersion: v1
kind: Service
metadata:
  name: datacendia-backend
  namespace: datacendia
  labels:
    app.kubernetes.io/name: datacendia-backend
spec:
  selector:
    app.kubernetes.io/name: datacendia-backend
  ports:
    - port: 3001
      targetPort: http
      protocol: TCP
      name: http
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: datacendia-backend
  namespace: datacendia
  labels:
    app.kubernetes.io/name: datacendia-backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: datacendia-backend
  namespace: datacendia
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: datacendia-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
