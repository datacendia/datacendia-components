apiVersion: apps/v1
kind: Deployment
metadata:
  name: datacendia-frontend
  namespace: datacendia
  labels:
    app.kubernetes.io/name: datacendia-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: datacendia-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: datacendia-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: datacendia-frontend
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: frontend
          image: datacendia/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: datacendia-frontend
  namespace: datacendia
spec:
  selector:
    app.kubernetes.io/name: datacendia-frontend
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  type: ClusterIP
