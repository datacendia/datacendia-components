apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: datacendia-ingress
  namespace: datacendia
  labels:
    app.kubernetes.io/name: datacendia-ingress
    app.kubernetes.io/part-of: datacendia-platform
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.datacendia.com
        - api.datacendia.com
      secretName: datacendia-tls
  rules:
    - host: app.datacendia.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: datacendia-frontend
                port:
                  number: 80
    - host: api.datacendia.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: datacendia-backend
                port:
                  number: 3001
