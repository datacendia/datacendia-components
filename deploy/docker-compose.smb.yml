# =============================================================================
# Datacendia SMB Docker Compose Bundle
# One-command self-hosted deployment for small/medium businesses
# =============================================================================
# Usage: docker-compose -f docker-compose.smb.yml up -d
# =============================================================================

version: '3.8'

services:
  # ==========================================================================
  # Frontend - React Application
  # ==========================================================================
  frontend:
    image: datacendia/frontend:latest
    build:
      context: ..
      dockerfile: Dockerfile.frontend.prod
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://backend:8080
      - VITE_WS_URL=ws://backend:8080
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # Backend - Node.js API Server
  # ==========================================================================
  backend:
    image: datacendia/backend:latest
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_URL=postgresql://datacendia:${DB_PASSWORD:-datacendia123}@postgres:5432/datacendia
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-datacendia}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-datacendia123}
      - OLLAMA_URL=http://ollama:11434
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-datacendia123}
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - DRUID_URL=http://druid-router:8888
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # PostgreSQL - Primary Database
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=datacendia
      - POSTGRES_PASSWORD=${DB_PASSWORD:-datacendia123}
      - POSTGRES_DB=datacendia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datacendia"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Redis - Caching & Sessions
  # ==========================================================================
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # MinIO - Object Storage (S3-compatible)
  # ==========================================================================
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-datacendia}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-datacendia123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # Ollama - Local LLM Runtime
  # ==========================================================================
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # For CPU-only: remove the deploy section above

  # ==========================================================================
  # Neo4j - Knowledge Graph Database
  # ==========================================================================
  neo4j:
    image: neo4j:5-community
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-datacendia123}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ==========================================================================
  # Apache Druid - Time-Series Analytics (Chronos)
  # ==========================================================================
  druid-coordinator:
    image: apache/druid:28.0.0
    command: coordinator
    environment:
      - DRUID_XMX=256m
      - DRUID_XMS=256m
      - druid_metadata_storage_connector_connectURI=jdbc:postgresql://postgres:5432/druid
      - druid_metadata_storage_connector_user=datacendia
      - druid_metadata_storage_connector_password=${DB_PASSWORD:-datacendia123}
      - druid_storage_type=local
      - druid_storage_storageDirectory=/opt/druid/var/druid/segments
    volumes:
      - druid_data:/opt/druid/var
    depends_on:
      - postgres
    restart: unless-stopped

  druid-broker:
    image: apache/druid:28.0.0
    command: broker
    environment:
      - DRUID_XMX=512m
      - DRUID_XMS=512m
    volumes:
      - druid_data:/opt/druid/var
    depends_on:
      - druid-coordinator
    restart: unless-stopped

  druid-router:
    image: apache/druid:28.0.0
    command: router
    ports:
      - "8888:8888"
    environment:
      - DRUID_XMX=128m
      - DRUID_XMS=128m
    depends_on:
      - druid-broker
    restart: unless-stopped

  # ==========================================================================
  # Nginx - Reverse Proxy & Load Balancer
  # ==========================================================================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  ollama_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  druid_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  default:
    name: datacendia-network
    driver: bridge
