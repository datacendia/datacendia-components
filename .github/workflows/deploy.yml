# =============================================================================
# DATACENDIA — DEPLOYMENT PIPELINE
# =============================================================================
# Enterprise Platinum Standard: Multi-stage deployment with approval gates
#
# Flow:
#   main branch push → Build → Deploy Staging → Smoke Test → (Manual Approval) → Deploy Production
#   release/** branch → Build → Deploy Staging only
#
# Prerequisites (GitHub Secrets):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
#   ECR_REGISTRY (e.g., 123456789.dkr.ecr.us-east-1.amazonaws.com)
#   ECS_CLUSTER_STAGING, ECS_SERVICE_STAGING
#   ECS_CLUSTER_PRODUCTION, ECS_SERVICE_PRODUCTION
#   STAGING_URL, PRODUCTION_URL
#   SLACK_WEBHOOK_URL (optional — for deployment notifications)
#   SENTRY_AUTH_TOKEN, SENTRY_ORG, SENTRY_PROJECT (optional)
# =============================================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip test suite (emergency hotfix only)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  # ===========================================================================
  # GATE: Run full test suite before any deployment
  # ===========================================================================
  pre-deploy-tests:
    name: Pre-Deploy Verification
    if: ${{ !inputs.skip_tests }}
    uses: ./.github/workflows/test.yml
    secrets: inherit

  # ===========================================================================
  # BUILD: Docker images for frontend + backend
  # ===========================================================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [pre-deploy-tests]
    if: always() && (needs.pre-deploy-tests.result == 'success' || inputs.skip_tests)
    timeout-minutes: 20

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      backend_image: ${{ steps.build-backend.outputs.image }}
      frontend_image: ${{ steps.build-frontend.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/datacendia
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push backend image
        id: build-backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/datacendia-backend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/datacendia-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
            BUILD_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

      - name: Build & push frontend image
        id: build-frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/datacendia-frontend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/datacendia-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # STAGING: Deploy to staging environment
  # ===========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: staging
      url: https://staging.datacendia.com
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy backend to ECS (Staging)
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER_STAGING || 'datacendia-staging' }} \
            --service ${{ secrets.ECS_SERVICE_BACKEND_STAGING || 'datacendia-backend-staging' }} \
            --force-new-deployment \
            --no-cli-pager
          echo "Backend deployment initiated"

      - name: Deploy frontend to ECS (Staging)
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER_STAGING || 'datacendia-staging' }} \
            --service ${{ secrets.ECS_SERVICE_FRONTEND_STAGING || 'datacendia-frontend-staging' }} \
            --force-new-deployment \
            --no-cli-pager
          echo "Frontend deployment initiated"

      - name: Wait for service stability
        run: |
          echo "Waiting for staging services to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ secrets.ECS_CLUSTER_STAGING || 'datacendia-staging' }} \
            --services \
              ${{ secrets.ECS_SERVICE_BACKEND_STAGING || 'datacendia-backend-staging' }} \
              ${{ secrets.ECS_SERVICE_FRONTEND_STAGING || 'datacendia-frontend-staging' }} \
            --no-cli-pager
          echo "✅ Staging services are stable"

      - name: Smoke test — health endpoint
        run: |
          STAGING_URL="${{ secrets.STAGING_URL || 'https://staging.datacendia.com' }}"
          echo "Testing health: $STAGING_URL/health"
          
          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL/health" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed (attempt $i)"
              exit 0
            fi
            echo "⏳ Attempt $i: HTTP $HTTP_CODE — retrying in 10s..."
            sleep 10
          done
          echo "::error::Health check failed after 5 attempts"
          exit 1

      - name: Smoke test — API readiness
        run: |
          STAGING_URL="${{ secrets.STAGING_URL || 'https://staging.datacendia.com' }}"
          
          # Test critical endpoints
          ENDPOINTS=(
            "/api/v1/health"
            "/api/v1/auth/status"
          )
          
          FAILED=0
          for EP in "${ENDPOINTS[@]}"; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL$EP" || echo "000")
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ]; then
              echo "✅ $EP → HTTP $HTTP_CODE"
            else
              echo "❌ $EP → HTTP $HTTP_CODE"
              FAILED=$((FAILED + 1))
            fi
          done
          
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED endpoint(s) failed smoke test"
            exit 1
          fi

      - name: Check Slack availability
        id: staging-integrations
        run: |
          if [ -n "$SLACK_URL" ]; then echo "slack=true" >> "$GITHUB_OUTPUT"; fi
        env:
          SLACK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack (staging deployed)
        if: success() && steps.staging-integrations.outputs.slack == 'true'
        continue-on-error: true
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"text\": \"✅ *Datacendia Staging Deployed*\n• Commit: \`${{ github.sha }}\`\n• Branch: \`${{ github.ref_name }}\`\n• Author: ${{ github.actor }}\n• URL: ${{ secrets.STAGING_URL || 'https://staging.datacendia.com' }}\"
            }" \
            ${{ secrets.SLACK_WEBHOOK_URL }} || true

  # ===========================================================================
  # PRODUCTION: Deploy with manual approval gate
  # ===========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.environment == 'production')
    environment:
      name: production
      url: https://app.datacendia.com
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Run database migrations (Production)
        run: |
          echo "Running Prisma migrations against production database..."
          # This uses ECS exec to run migrations inside the existing container
          # Alternatively, use a dedicated migration task definition
          echo "⚠️  Migrations should be run via a dedicated ECS task or bastion host"
          echo "Skipping automated migration — ensure manual migration is complete"

      - name: Deploy backend to ECS (Production)
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER_PRODUCTION || 'datacendia-production' }} \
            --service ${{ secrets.ECS_SERVICE_BACKEND_PRODUCTION || 'datacendia-backend-production' }} \
            --force-new-deployment \
            --no-cli-pager
          echo "Production backend deployment initiated"

      - name: Deploy frontend to ECS (Production)
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER_PRODUCTION || 'datacendia-production' }} \
            --service ${{ secrets.ECS_SERVICE_FRONTEND_PRODUCTION || 'datacendia-frontend-production' }} \
            --force-new-deployment \
            --no-cli-pager
          echo "Production frontend deployment initiated"

      - name: Wait for service stability
        run: |
          echo "Waiting for production services to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ secrets.ECS_CLUSTER_PRODUCTION || 'datacendia-production' }} \
            --services \
              ${{ secrets.ECS_SERVICE_BACKEND_PRODUCTION || 'datacendia-backend-production' }} \
              ${{ secrets.ECS_SERVICE_FRONTEND_PRODUCTION || 'datacendia-frontend-production' }} \
            --no-cli-pager
          echo "✅ Production services are stable"

      - name: Production smoke test
        run: |
          PROD_URL="${{ secrets.PRODUCTION_URL || 'https://app.datacendia.com' }}"
          
          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL/health" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Production health check passed"
              exit 0
            fi
            echo "⏳ Attempt $i: HTTP $HTTP_CODE — retrying in 15s..."
            sleep 15
          done
          echo "::error::Production health check failed"
          exit 1

      - name: Check optional integrations
        id: integrations
        run: |
          if [ -n "$SENTRY_TOKEN" ]; then echo "sentry=true" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$SLACK_URL" ]; then echo "slack=true" >> "$GITHUB_OUTPUT"; fi
        env:
          SENTRY_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SLACK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Create Sentry release
        if: steps.integrations.outputs.sentry == 'true'
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG || 'datacendia' }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT || 'datacendia-backend' }}
        with:
          environment: production
          version: ${{ github.sha }}

      - name: Notify Slack (production deployed)
        if: success() && steps.integrations.outputs.slack == 'true'
        continue-on-error: true
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"text\": \"🚀 *Datacendia Production Deployed*\n• Commit: \`${{ github.sha }}\`\n• Branch: \`${{ github.ref_name }}\`\n• Author: ${{ github.actor }}\n• URL: ${{ secrets.PRODUCTION_URL || 'https://app.datacendia.com' }}\"
            }" \
            ${{ secrets.SLACK_WEBHOOK_URL }} || true

      - name: Notify Slack (production FAILED)
        if: failure() && steps.integrations.outputs.slack == 'true'
        continue-on-error: true
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"text\": \"🔥 *DATACENDIA PRODUCTION DEPLOY FAILED*\n• Commit: \`${{ github.sha }}\`\n• Branch: \`${{ github.ref_name }}\`\n• Author: ${{ github.actor }}\n• Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }" \
            ${{ secrets.SLACK_WEBHOOK_URL }} || true
