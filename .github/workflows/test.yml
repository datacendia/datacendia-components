# =============================================================================
# DATACENDIA  TEST SUITE (Reusable)
# Called by deploy.yml and can be triggered manually
# =============================================================================

name: Test Suite

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: datacendia
          POSTGRES_PASSWORD: datacendia_test
          POSTGRES_DB: datacendia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datacendia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install system build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://datacendia:datacendia_test@localhost:5432/datacendia_test

      - name: Type check (main)
        working-directory: backend
        run: npx tsc --noEmit --skipLibCheck

      - name: Type check (test config — guards against tsconfig drift)
        working-directory: backend
        run: npx tsc --noEmit --skipLibCheck -p tsconfig.test.json

      - name: Lint
        working-directory: backend
        run: npx eslint src --ext .ts --max-warnings 0
        # Non-blocking: backend ESLint config warns on ~64 unused-var sites
        # pre-existing to the current cleanup pass. Flip to continue-on-error:
        # false once a dedicated unused-var sweep lands (see backend/.eslintrc.cjs
        # rule comment) OR change --max-warnings to an explicit ceiling that
        # freezes the current count and blocks regressions.
        continue-on-error: true

      - name: Run unit tests with coverage
        working-directory: backend
        run: npx vitest run --coverage
        env:
          CI: true
          DATABASE_URL: postgresql://datacendia:datacendia_test@localhost:5432/datacendia_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-for-ci-minimum-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-minimum-32-chars
          NODE_ENV: test

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 14

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npx tsc --noEmit --skipLibCheck

      - name: Build
        run: npx vite build
