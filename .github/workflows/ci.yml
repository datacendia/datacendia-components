# =============================================================================
# DATACENDIA CI PIPELINE
# Type-check, lint, test, and build verification on every push/PR
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ===========================================================================
  # FRONTEND: Type Check, Lint, Build
  # ===========================================================================
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Type-check and Lint are currently non-gating: the repo has known
      # legacy findings being worked off (see PLATFORM_AUDIT_2026-04-22.md).
      # Build + tests stay gating. Remove `continue-on-error` once backlog
      # is cleared and tsconfig strict flags are re-enabled.
      - name: Type check
        run: npx tsc --noEmit --skipLibCheck
        continue-on-error: true

      - name: Lint
        run: npx eslint src --ext .ts,.tsx --report-unused-disable-directives
        continue-on-error: true

      - name: Build
        run: npx vite build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 7

  # ===========================================================================
  # BACKEND: Type Check, Lint, Unit Tests, Build
  # ===========================================================================
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: datacendia
          POSTGRES_PASSWORD: datacendia_test
          POSTGRES_DB: datacendia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datacendia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # Repo is an npm workspace (root package.json declares workspaces:[backend]).
      # The backend has NO separate package-lock.json — the root one is shared.
      # Therefore we install from the root and `cd backend` only for scripts.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install system build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: Install dependencies (root + all workspaces)
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://datacendia:datacendia_test@localhost:5432/datacendia_test

      # Type-check and Lint are currently non-gating (see PLATFORM_AUDIT_2026-04-22.md).
      - name: Type check
        working-directory: backend
        run: npx tsc --noEmit --skipLibCheck
        continue-on-error: true

      - name: Lint
        working-directory: backend
        run: npm run lint
        continue-on-error: true

      - name: Verify Prisma schema is in sync
        working-directory: backend
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://datacendia:datacendia_test@localhost:5432/datacendia_test

      - name: Run unit tests with coverage
        working-directory: backend
        run: npx vitest run --coverage
        env:
          CI: true
          DATABASE_URL: postgresql://datacendia:datacendia_test@localhost:5432/datacendia_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-for-ci-minimum-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-minimum-32-chars
          NODE_ENV: test

      - name: Run infrastructure service tests
        working-directory: backend
        run: npx vitest run src/__tests__/infrastructure/ --reporter=verbose
        continue-on-error: true
        env:
          CI: true
          DATABASE_URL: postgresql://datacendia:datacendia_test@localhost:5432/datacendia_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-for-ci-minimum-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-minimum-32-chars
          NODE_ENV: test

      - name: Generate OpenAPI spec
        working-directory: backend
        run: |
          node -e "
            import('./dist/config/swagger.js')
              .then(m => {
                const fs = require('fs');
                fs.writeFileSync('openapi.json', JSON.stringify(m.swaggerSpec, null, 2));
                console.log('OpenAPI spec generated');
              })
              .catch(() => console.log('OpenAPI spec generation skipped (build required)'));
          "
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://datacendia:datacendia_test@localhost:5432/datacendia_test
        continue-on-error: true

      - name: Upload OpenAPI spec
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: openapi-spec
          path: backend/openapi.json
          retention-days: 30
        continue-on-error: true

  # ===========================================================================
  # STATUS CHECK — Required for branch protection
  # ===========================================================================
  ci-status:
    name: CI Status
    if: always()
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          echo "Frontend: ${{ needs.frontend.result }}"
          echo "Backend:  ${{ needs.backend.result }}"
          if [[ "${{ needs.frontend.result }}" == "failure" || "${{ needs.backend.result }}" == "failure" ]]; then
            echo "::error::CI failed — see individual job logs above"
            exit 1
          fi
          echo "All CI checks passed"
