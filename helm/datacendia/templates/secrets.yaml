apiVersion: v1
kind: Secret
metadata:
  name: {{ include "datacendia.fullname" . }}-secrets
  labels:
    {{- include "datacendia.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.backend.secrets.jwtSecret | quote }}
  JWT_REFRESH_SECRET: {{ .Values.backend.secrets.jwtRefreshSecret | quote }}
