# =============================================================================
# DATACENDIA HELM VALUES
# Production configuration for Kubernetes deployment
# =============================================================================

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# =============================================================================
# FRONTEND
# =============================================================================
frontend:
  replicaCount: 2
  image:
    repository: datacendia/frontend
    tag: latest
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 80
  
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: app.datacendia.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: datacendia-tls
        hosts:
          - app.datacendia.com
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

# =============================================================================
# BACKEND
# =============================================================================
backend:
  replicaCount: 3
  image:
    repository: datacendia/backend
    tag: latest
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 3001
    metricsPort: 9464
  
  env:
    NODE_ENV: production
    LOG_LEVEL: info
  
  secrets:
    # These should be created separately or via external-secrets
    jwtSecret: ""
    jwtRefreshSecret: ""
  
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi
  
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
  
  podDisruptionBudget:
    enabled: true
    minAvailable: 2

# =============================================================================
# OLLAMA (LLM Server)
# =============================================================================
ollama:
  enabled: true
  replicaCount: 2
  image:
    repository: ollama/ollama
    tag: latest
  
  service:
    type: ClusterIP
    port: 11434
  
  persistence:
    enabled: true
    size: 100Gi
    storageClass: fast-ssd
  
  resources:
    limits:
      nvidia.com/gpu: 1
      memory: 32Gi
    requests:
      nvidia.com/gpu: 1
      memory: 16Gi
  
  nodeSelector:
    nvidia.com/gpu.present: "true"

# =============================================================================
# POSTGRESQL
# =============================================================================
postgresql:
  enabled: true
  auth:
    username: datacendia
    database: datacendia
    existingSecret: datacendia-postgresql-secret
  
  primary:
    persistence:
      enabled: true
      size: 100Gi
      storageClass: fast-ssd
    
    resources:
      limits:
        cpu: 4000m
        memory: 16Gi
      requests:
        cpu: 1000m
        memory: 4Gi
  
  readReplicas:
    replicaCount: 2
    persistence:
      enabled: true
      size: 100Gi
  
  metrics:
    enabled: true

# =============================================================================
# REDIS
# =============================================================================
redis:
  enabled: true
  auth:
    enabled: true
    existingSecret: datacendia-redis-secret
  
  master:
    persistence:
      enabled: true
      size: 10Gi
    
    resources:
      limits:
        cpu: 1000m
        memory: 4Gi
      requests:
        cpu: 250m
        memory: 1Gi
  
  replica:
    replicaCount: 2
    persistence:
      enabled: true
      size: 10Gi
  
  sentinel:
    enabled: true
  
  metrics:
    enabled: true

# =============================================================================
# NEO4J
# =============================================================================
neo4j:
  enabled: true
  edition: enterprise
  
  neo4j:
    edition: enterprise
    acceptLicenseAgreement: "yes"
    password: ""  # Use existingSecret
  
  volumes:
    data:
      mode: defaultStorageClass
      defaultStorageClass:
        requests:
          storage: 50Gi
  
  resources:
    limits:
      cpu: 4000m
      memory: 16Gi
    requests:
      cpu: 1000m
      memory: 4Gi

# =============================================================================
# MONITORING
# =============================================================================
monitoring:
  prometheus:
    enabled: true
    retention: 30d
    storage: 50Gi
  
  grafana:
    enabled: true
    adminPassword: ""  # Use existingSecret
    persistence:
      enabled: true
      size: 10Gi
  
  jaeger:
    enabled: true
    storage:
      type: elasticsearch

# =============================================================================
# SECURITY
# =============================================================================
security:
  networkPolicies:
    enabled: true
  
  podSecurityPolicy:
    enabled: true
  
  vault:
    enabled: true
    address: "http://vault:8200"
    role: "datacendia"

# =============================================================================
# BACKUP
# =============================================================================
backup:
  enabled: true
  schedule: "0 2 * * *"  # 2 AM daily
  retention: 30
  
  s3:
    enabled: false
    bucket: ""
    region: ""
  
  azure:
    enabled: false
    container: ""
