openapi: 3.1.0
info:
  title: Datacendia API
  description: |
    Enterprise Decision Intelligence Platform API
    
    ## Authentication
    All endpoints except `/health` and `/api/v1/auth/*` require a valid JWT token.
    Include the token in the `Authorization` header: `Bearer <token>`
    
    ## Rate Limiting
    - Standard tier: 100 requests/minute
    - Enterprise tier: 1000 requests/minute
    - Rate limit headers: `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset`
    
    ## Error Responses
    All errors follow a consistent format with `success: false` and an `error` object.
  version: 1.0.0
  contact:
    name: Datacendia Support
    email: support@datacendia.com
    url: https://datacendia.com/support
  license:
    name: Proprietary
    url: https://datacendia.com/license

servers:
  - url: http://localhost:3001
    description: Development server
  - url: https://api.datacendia.com
    description: Production server

tags:
  - name: Health
    description: System health and status
  - name: Authentication
    description: User authentication and authorization
  - name: Decisions
    description: Decision management and tracking
  - name: Council
    description: AI Council deliberation system
  - name: Alerts
    description: Alert management
  - name: Users
    description: User management
  - name: Analytics
    description: Analytics and reporting
  - name: Integrations
    description: External integrations

paths:
  /health:
    get:
      tags: [Health]
      summary: Check API health status
      operationId: getHealth
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: healthy
                version: "1.0.0"
                timestamp: "2024-12-16T18:00:00.000Z"
                services:
                  database: connected
                  redis: connected
                  ollama: connected

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: SecurePassword123!
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email already exists

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required: [refreshToken]
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/decisions:
    get:
      tags: [Decisions]
      summary: List decisions
      operationId: listDecisions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortOrder'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DecisionStatus'
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/Priority'
        - name: department
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of decisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Decisions]
      summary: Create a new decision
      operationId: createDecision
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDecisionRequest'
            example:
              title: "Expand to European Market"
              description: "Evaluate opportunity for EU expansion"
              priority: HIGH
              department: Strategy
              stakeholders: ["ceo@company.com", "cfo@company.com"]
      responses:
        '201':
          description: Decision created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/decisions/{id}:
    get:
      tags: [Decisions]
      summary: Get decision by ID
      operationId: getDecision
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DecisionId'
      responses:
        '200':
          description: Decision details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Decisions]
      summary: Update decision
      operationId: updateDecision
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DecisionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDecisionRequest'
      responses:
        '200':
          description: Decision updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Decisions]
      summary: Delete decision
      operationId: deleteDecision
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DecisionId'
      responses:
        '204':
          description: Decision deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/council/query:
    post:
      tags: [Council]
      summary: Start council deliberation
      operationId: councilQuery
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouncilQueryRequest'
            example:
              topic: "Should we acquire CompanyX?"
              context: "CompanyX has 50 employees, $5M revenue, synergies in AI"
              agents: ["strategist", "analyst", "skeptic"]
              mode: standard
              maxRounds: 3
      responses:
        '200':
          description: Deliberation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouncilQueryResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/v1/council/agents:
    get:
      tags: [Council]
      summary: List available council agents
      operationId: listAgents
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'

  /api/v1/alerts:
    get:
      tags: [Alerts]
      summary: List alerts
      operationId: listAlerts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: severity
          in: query
          schema:
            $ref: '#/components/schemas/Severity'
        - name: acknowledged
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: List of alerts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertListResponse'

    post:
      tags: [Alerts]
      summary: Create alert
      operationId: createAlert
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertRequest'
      responses:
        '201':
          description: Alert created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'

  /api/v1/alerts/{id}/acknowledge:
    post:
      tags: [Alerts]
      summary: Acknowledge alert
      operationId: acknowledgeAlert
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Alert acknowledged
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/users:
    get:
      tags: [Users]
      summary: List users
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/UserRole'
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'

  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Get current user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /api/v1/auth/login

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SortBy:
      name: sortBy
      in: query
      schema:
        type: string
    SortOrder:
      name: sortOrder
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    DecisionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: Authentication required
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Resource not found
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    RateLimited:
      description: Rate limit exceeded
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: RATE_LIMITED
              message: Too many requests

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        version:
          type: string
        timestamp:
          type: string
          format: date-time
        services:
          type: object
          additionalProperties:
            type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
      required: [success, error]

    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR]
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  message:
                    type: string
                  code:
                    type: string

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        mfaCode:
          type: string
          pattern: '^\d{6}$'
      required: [email, password]

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            token:
              type: string
            refreshToken:
              type: string
            user:
              $ref: '#/components/schemas/User'
            expiresIn:
              type: integer

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
        name:
          type: string
          minLength: 1
          maxLength: 255
        organizationName:
          type: string
      required: [email, password, name]

    RegisterResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            message:
              type: string

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        department:
          type: string
        createdAt:
          type: string
          format: date-time

    UserRole:
      type: string
      enum: [admin, analyst, operator, auditor, viewer]

    Priority:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]

    DecisionStatus:
      type: string
      enum: [PENDING, BLOCKED, DEFERRED, ESCALATED, APPROVED, REJECTED, IMPLEMENTED]

    Severity:
      type: string
      enum: [info, warning, error, critical]

    Decision:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/DecisionStatus'
        priority:
          $ref: '#/components/schemas/Priority'
        department:
          type: string
        category:
          type: string
        stakeholders:
          type: array
          items:
            type: string
            format: email
        budget:
          type: number
        deadline:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time

    CreateDecisionRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 10000
        priority:
          $ref: '#/components/schemas/Priority'
        department:
          type: string
        category:
          type: string
          enum: [strategic, operational, tactical, compliance]
        stakeholders:
          type: array
          items:
            type: string
            format: email
        budget:
          type: number
          minimum: 0
        deadline:
          type: string
          format: date-time
      required: [title]

    UpdateDecisionRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/DecisionStatus'
        priority:
          $ref: '#/components/schemas/Priority'
        resolution:
          type: string

    DecisionResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Decision'

    DecisionListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
        pagination:
          $ref: '#/components/schemas/Pagination'

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    CouncilQueryRequest:
      type: object
      properties:
        topic:
          type: string
          minLength: 1
          maxLength: 5000
        context:
          type: string
          maxLength: 50000
        agents:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 10
        mode:
          type: string
          enum: [standard, debate, consensus, rapid]
          default: standard
        maxRounds:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
      required: [topic]

    CouncilQueryResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            topic:
              type: string
            status:
              type: string
            responses:
              type: array
              items:
                type: object
                properties:
                  agent:
                    type: string
                  role:
                    type: string
                  response:
                    type: string
                  confidence:
                    type: number
                  timestamp:
                    type: string
                    format: date-time
            consensus:
              type: object
              properties:
                recommendation:
                  type: string
                confidence:
                  type: number
                dissentingViews:
                  type: array
                  items:
                    type: string

    Agent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
        personality:
          type: string
        expertise:
          type: array
          items:
            type: string
        available:
          type: boolean

    AgentListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Agent'

    Alert:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        message:
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
        source:
          type: string
        acknowledged:
          type: boolean
        acknowledgedAt:
          type: string
          format: date-time
        acknowledgedBy:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateAlertRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        message:
          type: string
          maxLength: 5000
        severity:
          $ref: '#/components/schemas/Severity'
        source:
          type: string
        metadata:
          type: object
      required: [title, message, severity, source]

    AlertResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Alert'

    AlertListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        pagination:
          $ref: '#/components/schemas/Pagination'

    UserResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/User'

    UserListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          $ref: '#/components/schemas/Pagination'
