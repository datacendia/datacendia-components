# =============================================================================
# APACHE DRUID - Common Runtime Properties
# =============================================================================
# Datacendia Sovereign Stack Configuration
# =============================================================================

# Extensions
druid.extensions.loadList=["druid-kafka-indexing-service", "druid-datasketches", "druid-lookups-cached-global", "postgresql-metadata-storage"]

# Logging
druid.startup.logging.logProperties=true

# Zookeeper (using built-in for single-node)
druid.zk.service.host=localhost
druid.zk.paths.base=/druid

# Metadata storage (PostgreSQL)
druid.metadata.storage.type=postgresql
druid.metadata.storage.connector.connectURI=jdbc:postgresql://postgres:5432/druid
druid.metadata.storage.connector.user=cendia
druid.metadata.storage.connector.password=cendia_sovereign_2025

# Deep storage (MinIO/S3)
druid.storage.type=s3
druid.storage.bucket=cendia-druid
druid.storage.baseKey=druid/segments
druid.s3.accessKey=cendia_admin
druid.s3.secretKey=cendia_sovereign_2025
druid.s3.endpoint.url=http://minio:9000
druid.s3.enablePathStyleAccess=true

# Indexing logs (MinIO/S3)
druid.indexer.logs.type=s3
druid.indexer.logs.s3Bucket=cendia-druid
druid.indexer.logs.s3Prefix=druid/indexing-logs

# Service discovery
druid.selectors.indexing.serviceName=druid/overlord
druid.selectors.coordinator.serviceName=druid/coordinator

# Monitoring
druid.monitoring.monitors=["org.apache.druid.java.util.metrics.JvmMonitor"]
druid.emitter=noop

# SQL
druid.sql.enable=true
druid.sql.planner.useGroupingSetForExactDistinct=true

# Request logging
druid.request.logging.type=slf4j
