<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CendiaGateway</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0A0A0A;
      color: #E5E5E5;
    }
    .header {
      background: linear-gradient(135deg, #1A1A2E 0%, #16213E 100%);
      padding: 16px;
      border-bottom: 2px solid #D4AF37;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 {
      font-size: 16px;
      color: #D4AF37;
      font-weight: 600;
    }
    .header .subtitle {
      font-size: 11px;
      color: #888;
    }
    .shield {
      width: 32px;
      height: 32px;
      background: #D4AF37;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #111;
      border-bottom: 1px solid #222;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22C55E;
    }
    .dot.disabled { background: #666; }
    .status-text { font-size: 13px; }
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #333;
      border-radius: 12px;
      transition: 0.3s;
    }
    .toggle .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.3s;
    }
    .toggle input:checked + .slider { background: #D4AF37; }
    .toggle input:checked + .slider:before { transform: translateX(20px); }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1px;
      background: #222;
      margin: 0;
    }
    .stat {
      background: #111;
      padding: 12px 8px;
      text-align: center;
    }
    .stat .value {
      font-size: 20px;
      font-weight: 700;
      color: #D4AF37;
    }
    .stat .label {
      font-size: 10px;
      color: #888;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat.blocked .value { color: #EF4444; }
    .info {
      padding: 12px 16px;
      font-size: 11px;
      color: #666;
      text-align: center;
      border-top: 1px solid #222;
    }
    .info a {
      color: #D4AF37;
      text-decoration: none;
    }
    .footer {
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      border-top: 1px solid #222;
    }
    .footer button {
      flex: 1;
      padding: 8px;
      font-size: 11px;
      border: 1px solid #333;
      background: #1A1A1A;
      color: #CCC;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }
    .footer button:hover {
      background: #222;
      border-color: #D4AF37;
      color: #D4AF37;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="shield">🛡</div>
    <div>
      <h1>CendiaGateway</h1>
      <div class="subtitle">AI Governance Gateway</div>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-indicator">
      <div class="dot" id="statusDot"></div>
      <span class="status-text" id="statusText">Active — Governing AI Traffic</span>
    </div>
    <label class="toggle">
      <input type="checkbox" id="enableToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="value" id="intercepted">0</div>
      <div class="label">Intercepted</div>
    </div>
    <div class="stat blocked">
      <div class="value" id="blocked">0</div>
      <div class="label">Blocked</div>
    </div>
    <div class="stat">
      <div class="value" id="providers">9</div>
      <div class="label">Providers</div>
    </div>
  </div>

  <div class="info">
    Every AI interaction is governed, signed, and logged.<br>
    <a href="#" id="dashboardLink">Open Gateway Dashboard →</a>
  </div>

  <div class="footer">
    <button id="resetBtn">Reset Stats</button>
    <button id="settingsBtn">Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
