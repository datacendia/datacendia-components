[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:redis]
command=redis-server --port 6379 --dir /data/redis --appendonly yes
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis-error.log

[program:backend]
command=/app/backend/node_modules/.bin/tsx /app/backend/src/index.ts
directory=/app/backend
autostart=true
autorestart=true
environment=NODE_ENV="production",PORT="3001",DATABASE_URL="file:/data/sqlite/datacendia.db",REDIS_URL="redis://127.0.0.1:6379"
stdout_logfile=/var/log/supervisor/backend.log
stderr_logfile=/var/log/supervisor/backend-error.log

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx-error.log
