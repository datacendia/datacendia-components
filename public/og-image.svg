<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="50%" style="stop-color:#1E293B"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Grid Pattern -->
  <g opacity="0.1">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#64748B" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#64748B" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#64748B" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#64748B" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#64748B" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#64748B" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#64748B" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#64748B" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#64748B" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#64748B" stroke-width="1"/>
  </g>
  
  <!-- Glowing orbs -->
  <circle cx="900" cy="200" r="200" fill="url(#glowGradient)" opacity="0.5"/>
  <circle cx="300" cy="450" r="150" fill="url(#glowGradient)" opacity="0.3"/>
  
  <!-- Logo Container -->
  <g transform="translate(80, 240)">
    <!-- Logo Icon -->
    <rect x="0" y="0" width="80" height="80" rx="16" fill="url(#accentGradient)"/>
    <text x="40" y="55" font-family="Arial, sans-serif" font-size="40" fill="white" text-anchor="middle" font-weight="bold">D</text>
  </g>
  
  <!-- Main Text -->
  <text x="180" y="295" font-family="Arial, sans-serif" font-size="72" fill="white" font-weight="bold">
    Datacendia
  </text>
  
  <!-- Tagline -->
  <text x="80" y="370" font-family="Arial, sans-serif" font-size="32" fill="#94A3B8">
    Enterprise Intelligence Platform
  </text>
  
  <!-- Feature Pills -->
  <g transform="translate(80, 420)">
    <!-- AI Decision Intelligence -->
    <rect x="0" y="0" width="240" height="44" rx="22" fill="#1E40AF" opacity="0.3"/>
    <rect x="0" y="0" width="240" height="44" rx="22" stroke="#3B82F6" stroke-width="1" fill="none"/>
    <text x="120" y="28" font-family="Arial, sans-serif" font-size="16" fill="#60A5FA" text-anchor="middle">🧠 AI Decision Intelligence</text>
    
    <!-- Predictive Analytics -->
    <rect x="260" y="0" width="200" height="44" rx="22" fill="#1E40AF" opacity="0.3"/>
    <rect x="260" y="0" width="200" height="44" rx="22" stroke="#3B82F6" stroke-width="1" fill="none"/>
    <text x="360" y="28" font-family="Arial, sans-serif" font-size="16" fill="#60A5FA" text-anchor="middle">🔮 Predictive Analytics</text>
    
    <!-- Workflow Automation -->
    <rect x="480" y="0" width="210" height="44" rx="22" fill="#1E40AF" opacity="0.3"/>
    <rect x="480" y="0" width="210" height="44" rx="22" stroke="#3B82F6" stroke-width="1" fill="none"/>
    <text x="585" y="28" font-family="Arial, sans-serif" font-size="16" fill="#60A5FA" text-anchor="middle">⚡ Workflow Automation</text>
  </g>
  
  <!-- Decorative Elements - Neural Network -->
  <g transform="translate(750, 150)" opacity="0.6">
    <!-- Nodes -->
    <circle cx="100" cy="50" r="8" fill="#3B82F6"/>
    <circle cx="200" cy="100" r="10" fill="#8B5CF6"/>
    <circle cx="150" cy="180" r="8" fill="#3B82F6"/>
    <circle cx="280" cy="60" r="6" fill="#60A5FA"/>
    <circle cx="320" cy="150" r="10" fill="#8B5CF6"/>
    <circle cx="250" cy="200" r="8" fill="#3B82F6"/>
    <circle cx="50" cy="120" r="6" fill="#60A5FA"/>
    <circle cx="350" cy="80" r="6" fill="#60A5FA"/>
    
    <!-- Connections -->
    <line x1="100" y1="50" x2="200" y2="100" stroke="#3B82F6" stroke-width="1" opacity="0.5"/>
    <line x1="200" y1="100" x2="150" y2="180" stroke="#8B5CF6" stroke-width="1" opacity="0.5"/>
    <line x1="200" y1="100" x2="280" y2="60" stroke="#3B82F6" stroke-width="1" opacity="0.5"/>
    <line x1="280" y1="60" x2="320" y2="150" stroke="#8B5CF6" stroke-width="1" opacity="0.5"/>
    <line x1="150" y1="180" x2="250" y2="200" stroke="#3B82F6" stroke-width="1" opacity="0.5"/>
    <line x1="320" y1="150" x2="250" y2="200" stroke="#8B5CF6" stroke-width="1" opacity="0.5"/>
    <line x1="50" y1="120" x2="100" y2="50" stroke="#60A5FA" stroke-width="1" opacity="0.5"/>
    <line x1="280" y1="60" x2="350" y2="80" stroke="#60A5FA" stroke-width="1" opacity="0.5"/>
    <line x1="50" y1="120" x2="150" y2="180" stroke="#60A5FA" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Bottom accent line -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accentGradient)"/>
  
  <!-- URL -->
  <text x="1120" y="590" font-family="Arial, sans-serif" font-size="18" fill="#64748B" text-anchor="end">
    datacendia.com
  </text>
</svg>
