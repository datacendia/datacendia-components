services:
  - type: web
    name: datacendia-api
    runtime: node
    buildCommand: cd backend && npm install && npx prisma generate && npm run build
    startCommand: cd backend && npx prisma db push --accept-data-loss && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: datacendia-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: datacendia-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://app.datacendia.com,https://datacendia.com
      - key: OLLAMA_BASE_URL
        value: ""
    healthCheckPath: /health

  - type: web
    name: datacendia-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://datacendia-api.onrender.com/api/v1

databases:
  - name: datacendia-db
    plan: free
    databaseName: datacendia
    user: datacendia
