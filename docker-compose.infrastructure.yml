version: '3.8'

services:
  # =============================================================================
  # REDIS - Caching and Session Management
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: datacendia-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass datacendia2024
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # =============================================================================
  # NEO4J - Graph Database
  # =============================================================================
  neo4j:
    image: neo4j:5-community
    container_name: datacendia-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      NEO4J_AUTH: neo4j/datacendia2024
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "datacendia2024", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # APACHE DRUID - Time-Series Analytics (DISABLED - config issues)
  # =============================================================================
  # =============================================================================
  # CLICKHOUSE - Fast Analytics Database
  # =============================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: datacendia-clickhouse
    ports:
      - "8123:8123"  # HTTP
      - "9000:9000"  # Native
    environment:
      CLICKHOUSE_DB: datacendia
      CLICKHOUSE_USER: datacendia
      CLICKHOUSE_PASSWORD: datacendia2024
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # KEYCLOAK - Enterprise SSO (DISABLED - config issues)
  # =============================================================================
  # =============================================================================
  # APACHE TIKA - Document Extraction
  # =============================================================================
  tika:
    image: apache/tika:latest
    container_name: datacendia-tika
    ports:
      - "9998:9998"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9998/tika"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # GRAFANA - Monitoring Dashboards
  # =============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: datacendia-grafana
    ports:
      - "3100:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: datacendia2024
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infrastructure/grafana/datasources:/etc/grafana/provisioning/datasources
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # GRAFANA TEMPO - Distributed Tracing (DISABLED - config issues)
  # =============================================================================
  # =============================================================================
  # PROMETHEUS - Metrics Collection
  # =============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: datacendia-prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - prometheus-data:/prometheus
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
    driver: local
  neo4j-data:
    driver: local
  neo4j-logs:
    driver: local
  druid-data:
    driver: local
  clickhouse-data:
    driver: local
  clickhouse-logs:
    driver: local
  grafana-data:
    driver: local
  tempo-data:
    driver: local
  prometheus-data:
    driver: local

networks:
  default:
    name: datacendia-network
    driver: bridge

