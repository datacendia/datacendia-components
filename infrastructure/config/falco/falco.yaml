# Falco configuration for Datacendia runtime security
rules_file:
  - /etc/falco/falco_rules.yaml
  - /etc/falco/falco_rules.local.yaml

json_output: true
json_include_output_property: true

log_stderr: true
log_syslog: false
log_level: info

priority: debug

outputs:
  rate: 1
  max_burst: 1000

syslog_output:
  enabled: false

file_output:
  enabled: true
  keep_alive: false
  filename: /var/log/falco/events.log

stdout_output:
  enabled: true

http_output:
  enabled: true
  url: http://loki:3100/loki/api/v1/push

program_output:
  enabled: false

grpc:
  enabled: true
  bind_address: "0.0.0.0:8765"
  threadiness: 8

grpc_output:
  enabled: true
