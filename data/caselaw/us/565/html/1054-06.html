    <p id="AaCa" data-blocks='[["BL_1136.25",1136,[1268,1671,250,34]],["BL_1136.26",1136,[261,1719,1258,183]]]'>Cabell Jones Regan, of Pittsboro, N. C., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
