    <p id="AbSA" data-blocks='[["BL_1136.21",1136,[1211,1413,308,42]],["BL_1136.22",1136,[262,1461,1258,183]]]'>Gregory Bartko, of Atlanta, Ga., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
