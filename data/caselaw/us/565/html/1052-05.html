    <h4 class="parties" id="Aj8b" data-blocks='[["BL_1134.27",1134,[589,1719,605,34]]]'>In re Discipline of Mabry.</h4>
  </section>
  <article class="opinion" data-type="majority">
    <p id="AfbyK" data-blocks='[["BL_1134.28",1134,[1239,1720,280,40]],["BL_1134.29",1134,[263,1766,1257,185]]]'>Ralph Thomas Mabry, Jr., of Silver Spring, Md., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
