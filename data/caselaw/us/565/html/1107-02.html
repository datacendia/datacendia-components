    <p id="AgQS" data-blocks='[["BL_1189.10",1189,[1121,713,308,41]],["BL_1189.11",1189,[175,760,1255,183]]]'>John Joseph Zo-drow of Denver, Colo., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
