  <article class="opinion" data-type="majority">
    <p id="AHbN" data-blocks='[["BL_1135.10",1135,[1163,804,283,40]],["BL_1135.11",1135,[192,850,1256,185]]]'>Jeffry S. Pearson, of Philadelphia, Pa., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
