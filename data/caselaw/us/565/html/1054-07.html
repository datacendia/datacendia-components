    <p id="AFO4" data-blocks='[["BL_1136.29",1136,[1173,1929,348,41]],["BL_1136.30",1136,[261,1977,1259,177]]]'>Tonya L. Ford, of Raleigh, N. C., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring her to show cause why she should not be disbarred from the practice of law in this Court.</p>
