  <article class="opinion" data-type="majority">
    <p id="A7hP" data-blocks='[["BL_1135.6",1135,[1159,544,287,33]],["BL_1135.7",1135,[192,590,1257,183]]]'>Frank H. Morgan, Jr., of West Chester, Pa., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
