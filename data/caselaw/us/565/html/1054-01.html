  <article class="opinion" data-type="majority">
    <p id="AQv6" data-blocks='[["BL_1136.5",1136,[1225,374,298,34]],["BL_1136.6",1136,[267,423,1260,186]]]'>Richard T. Cotter, of Fort Myers Beach, Fla., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
