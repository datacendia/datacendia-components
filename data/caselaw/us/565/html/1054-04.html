  <article class="opinion" data-type="majority">
    <p id="Amyj" data-blocks='[["BL_1136.17",1136,[1223,1153,298,33]],["BL_1136.18",1136,[263,1201,1258,184]]]'>Samuel Warren Cruse, of Augusta, Ga., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
