  <article class="opinion" data-type="majority">
    <p id="A0EY" data-blocks='[["BL_1189.26",1189,[1162,1782,269,42]],["BL_1189.27",1189,[175,1829,1257,182]]]'>David S. Moy-nihan of San Diego, Cal., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
