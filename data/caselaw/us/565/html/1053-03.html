  <article class="opinion" data-type="majority">
    <p id="AUJr" data-blocks='[["BL_1135.14",1135,[1263,1065,183,32]],["BL_1135.15",1135,[193,1111,1258,183]]]'>Daniel A. Woolverton, of Lakeland, Fla., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
