  <article class="opinion" data-type="majority">
    <p id="A7UJ" data-blocks='[["BL_1135.26",1135,[1142,1843,306,32]],["BL_1135.27",1135,[193,1889,1256,183]]]'>Sara Davis Har-man, of Glen Allen, Va., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring her to show cause why she should not be disbarred from the practice of law in this Court.</p>
