  <article class="opinion" data-type="majority">
    <p id="AFlGr" data-blocks='[["BL_810.5",810,[1278,364,267,34]],["BL_810.6",810,[285,412,1263,189]]]'>David Farrell Holmes, of Hutchinson, Kan., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
