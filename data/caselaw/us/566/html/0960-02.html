  <article class="opinion" data-type="majority">
    <p id="A8gm" data-blocks='[["BL_836.10",836,[1297,758,253,33]],["BL_836.11",836,[290,806,1261,187]]]'>Ronald Russ Snyder, of Jefferson, Ky., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
