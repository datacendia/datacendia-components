  <article class="opinion" data-type="majority">
    <p id="AmEd" data-blocks='[["BL_835.29",835,[1128,1491,326,40]],["BL_835.30",835,[196,1536,1259,183]]]'>Tracy Hicks Barley, of Durham, N. C., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring her to show cause why she should not be disbarred from the practice of law in this Court.</p>
