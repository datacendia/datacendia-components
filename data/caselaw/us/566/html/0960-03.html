    <p id="AQEh" data-blocks='[["BL_836.14",836,[1335,1026,214,33]],["BL_836.15",836,[289,1074,1262,184]]]'>Robert W. Shimer, of Camp Hill, Pa., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
