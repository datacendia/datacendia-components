  <article class="opinion" data-type="majority">
    <p id="ASy3" data-blocks='[["BL_836.26",836,[1289,1821,260,34]],["BL_836.27",836,[289,1869,1261,185]]]'>Norman Paul Wexler, of Weston, Fla., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
