  <article class="opinion" data-type="majority">
    <p id="ASpv" data-blocks='[["BL_794.30",794,[1269,2086,287,35]],["BL_794.31",794,[294,2134,1263,189]]]'>Charles Ruffin Poole, of Raleigh, N. C., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
