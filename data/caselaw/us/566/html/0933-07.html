  <article class="opinion" data-type="majority">
    <p id="AIrM" data-blocks='[["BL_809.30",809,[1217,2102,233,34]],["BL_809.31",809,[191,2148,1258,183]]]'>Charles Michael Clifford, of Charlestown, Mass., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
