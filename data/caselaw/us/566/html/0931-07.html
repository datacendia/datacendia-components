    <p id="A-p" data-blocks='[["BL_807.40",807,[1146,2093,302,34]],["BL_807.41",807,[190,2138,1258,183]]]'>William O. Guf-fey, of Chula Vista, Cal., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
