    <p id="A9hB" data-blocks='[["BL_860.26",860,[1206,1712,325,40]],["BL_860.27",860,[272,1759,1261,187]]]'>Bruce W. Simon, of Saint Joseph, Mo., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
