  <article class="opinion" data-type="majority">
    <p id="A1I5" data-blocks='[["BL_809.22",809,[1181,1584,269,33]],["BL_809.23",809,[192,1630,1259,184]]]'>Willie J. Nunnery, of Madison, Wis., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
