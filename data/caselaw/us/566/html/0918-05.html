  <article class="opinion" data-type="majority">
    <p id="A3n6" data-blocks='[["BL_794.22",794,[1257,1555,299,42]],["BL_794.23",794,[294,1603,1264,185]]]'>Mary Marstella Schmidt Meade, of Fairfax, Va., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring her to show cause why she should not be disbarred from the practice of law in this Court.</p>
