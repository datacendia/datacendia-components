  <article class="opinion" data-type="majority">
    <p id="AdfR" data-blocks='[["BL_810.21",810,[1406,1427,140,41]],["BL_810.22",810,[286,1475,1261,187]]]'>Stanley Howard Needleman, of Baltimore, Md., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
