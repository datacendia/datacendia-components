  <article class="opinion" data-type="majority">
    <p id="A5o1" data-blocks='[["BL_808.5",808,[1337,362,203,33]],["BL_808.6",808,[284,409,1259,187]]]'>Thomas V. Rasmussen, Jr., of Salt Lake City, Utah, is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
