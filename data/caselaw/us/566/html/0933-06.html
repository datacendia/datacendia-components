  <article class="opinion" data-type="majority">
    <p id="AJXx" data-blocks='[["BL_809.26",809,[1161,1844,289,41]],["BL_809.27",809,[192,1890,1259,183]]]'>W. Craig Howell, of Omaha, Neb., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
