  <article class="opinion" data-type="majority">
    <p id="AO3Y" data-blocks='[["BL_809.18",809,[1194,1326,257,34]],["BL_809.19",809,[193,1371,1261,184]]]'>Lewis Steven Goldblatt, of West Dover, Vt., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
