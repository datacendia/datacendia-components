  <article class="opinion" data-type="majority">
    <p id="AGsI" data-blocks='[["BL_836.6",836,[1405,494,145,33]],["BL_836.7",836,[290,541,1264,184]]]'>William P. Fitzgerald, of Sayville, N. Y., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
