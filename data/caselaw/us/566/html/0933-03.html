    <p id="AVzh" data-blocks='[["BL_809.14",809,[1145,1065,306,34]],["BL_809.15",809,[193,1111,1259,184]]]'>Lucille Saundra White, of Bowie, Md., is suspended from the practice of law in this Court, and a rule will-issue, returnable within 40 days, requiring her to show cause why she should not be disbarred from the practice of law in this Court.</p>
