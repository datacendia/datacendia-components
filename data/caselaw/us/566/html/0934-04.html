    <h4 class="parties" id="AmFc" data-blocks='[["BL_810.16",810,[599,1163,608,34]]]'>In re Discipline of Nwadike.</h4>

  <article class="opinion" data-type="majority">
    <p id="AYNM" data-blocks='[["BL_810.17",810,[1252,1161,293,40]],["BL_810.18",810,[286,1209,1259,187]]]'>Ozomena Mary-rose Nwadike, of Silver Spring, Md., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring her to show cause why she should not be disbarred from the practice of law in this Court.</p>
