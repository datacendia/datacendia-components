    <p id="Ax0i" data-blocks='[["BL_810.13",810,[1286,896,258,34]],["BL_810.14",810,[286,943,1260,187]]]'>John Charles Wilson, of Mobile, Ala., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
