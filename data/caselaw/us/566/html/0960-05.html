  <article class="opinion" data-type="majority">
    <p id="Adp2" data-blocks='[["BL_836.22",836,[1266,1554,284,33]],["BL_836.23",836,[289,1601,1261,186]]]'>Michael David Sinko, of Cherry Hill, N. J., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
