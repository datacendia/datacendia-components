    <p class="docketnumber" id="b810-9" data-blocks='[["BL_810.23",810,[330,1696,245,33]]]'>No. D-2657.</p>
    <h4 class="parties" id="AKR" data-blocks='[["BL_810.24",810,[620,1695,735,34]]]'>In re Discipline of Lieberman.</h4>
  </section>
  <article class="opinion" data-type="majority">
    <p id="ANs" data-blocks='[["BL_810.25",810,[1401,1693,146,33]],["BL_810.26",810,[286,1741,1261,185]]]'>Richard Donald Lieberman, of Bethesda, Md., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
