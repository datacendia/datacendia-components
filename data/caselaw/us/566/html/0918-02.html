  <article class="opinion" data-type="majority">
    <p id="AGe" data-blocks='[["BL_794.10",794,[1443,760,109,33]],["BL_794.11",794,[294,808,1260,186]]]'>David Burkenroad, of Los Angeles, Cal., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
