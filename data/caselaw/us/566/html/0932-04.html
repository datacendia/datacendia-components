  <article class="opinion" data-type="majority">
    <p id="A7NM" data-blocks='[["BL_808.17",808,[1347,1158,195,34]],["BL_808.18",808,[283,1207,1260,185]]]'>Robert M. Mardirosian, of East Falmouth, Mass., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
