  <article class="opinion" data-type="majority">
    <p id="Avv" data-blocks='[["BL_807.36",807,[1260,1825,188,33]],["BL_807.37",807,[190,1869,1260,182]]]'>Robert T. McAllister, of Denver, Colo., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
