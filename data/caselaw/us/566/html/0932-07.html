    <p id="Aqol" data-blocks='[["BL_808.29",808,[1274,1957,270,32]],["BL_808.30",808,[284,2004,1261,185]]]'>Brett Nathan Dorny, of Arvada, Colo., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
