    <p id="AD9" data-blocks='[["BL_795.5",795,[1197,370,254,34]],["BL_795.6",795,[194,416,1258,185]]]'>Gilbert Scott Bagnell, of Catskill, N. Y., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should:not be disbarred from the practice of law in this Court.</p>
