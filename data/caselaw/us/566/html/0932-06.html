  <article class="opinion" data-type="majority">
    <p id="ABFR" data-blocks='[["BL_808.25",808,[1264,1690,280,33]],["BL_808.26",808,[284,1738,1260,186]]]'>Leonard Sherman Needle, of Fair Haven, N. J., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
