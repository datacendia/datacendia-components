  </section>
  <article class="opinion" data-type="majority">
    <p id="AoUr" data-blocks='[["BL_795.9",795,[1274,637,176,42]],["BL_795.10",795,[194,683,1257,185]]]'>Philip C. Klingsmith III, of Gunnison, Colo., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
