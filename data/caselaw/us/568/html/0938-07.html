    <p class="docketnumber" id="b1014-10" data-blocks='[["BL_1014.32",1014,[293,1256,223,33]]]'>No. D-2693.</p>
    <h4 class="parties" id="AEqp-" data-blocks='[["BL_1014.33",1014,[563,1258,703,35]]]'>In re Discipline of Kirshenbaum.</h4>
  </section>
  <article class="opinion" data-type="majority">
    <p id="A1iD" data-blocks='[["BL_1014.34",1014,[1311,1260,195,33]],["BL_1014.35",1014,[247,1303,1259,185]]]'>Warren A. Kirshenbaum, of Newton, Mass., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
