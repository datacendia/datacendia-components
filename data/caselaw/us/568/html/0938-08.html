  <article class="opinion" data-type="majority">
    <p id="Atjy" data-blocks='[["BL_1014.38",1014,[1268,1531,237,41]],["BL_1014.39",1014,[245,1574,1263,181]]]'>Ronald Kay Barker, of Lee’s Summit, Mo., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
