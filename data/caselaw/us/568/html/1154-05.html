  <article class="opinion" data-type="majority">
    <p id="A8Re" data-blocks='[["BL_1230.22",1230,[1318,1235,208,40]],["BL_1230.23",1230,[271,1279,1257,182]]]'>Joseph W. Weigel, of Milwaukee, Wis., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
