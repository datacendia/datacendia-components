    <h4 class="parties" id="Aay5R" data-blocks='[["BL_1230.13",1230,[590,727,621,33]]]'>In re Discipline of Erickson.</h4>
  </section>
  <article class="opinion" data-type="majority">
    <p id="AknFt" data-blocks='[["BL_1230.14",1230,[1255,728,274,32]],["BL_1230.15",1230,[273,773,1256,185]]]'>Theresa Marie Erickson, of Poway, Cal., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring her to show cause why she should not be disbarred from the practice of law in this Court.</p>
