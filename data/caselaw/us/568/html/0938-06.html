  </section>
  <article class="opinion" data-type="majority">
    <p id="Ayrf" data-blocks='[["BL_1014.30",1014,[1180,992,327,40]],["BL_1014.31",1014,[249,1035,1259,181]]]'>Clifford R. Roth, of Otisville, N. Y., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
