    <p id="AE0U" data-blocks='[["BL_1158.19",1158,[1216,1030,314,40]],["BL_1158.20",1158,[271,1075,1260,181]]]'>Bruce P. Golden, of Chicago, Ill., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
