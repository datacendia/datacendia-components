  <article class="opinion" data-type="majority">
    <p id="Ar3Vg" data-blocks='[["BL_1014.42",1014,[1163,1800,339,40]],["BL_1014.43",1014,[243,1842,1260,184]]]'>Richard B. Payne, of Kansas City, Kan., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
