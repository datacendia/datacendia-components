  <article class="opinion" data-type="majority">
    <p id="AAhx5" data-blocks='[["BL_1015.5",1015,[1089,350,302,40]],["BL_1015.6",1015,[140,397,1253,185]]]'>Wayne Thomas Prem, of Towson, Md., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
