    <h4 class="parties" id="Ac8W" data-blocks='[["BL_1302.13",1302,[597,922,699,33]]]'>In re Discipline of FitzGerald.</h4>
  </section>
  <article class="opinion" data-type="majority">
    <p id="A_eQk" data-blocks='[["BL_1302.14",1302,[1341,923,185,40]],["BL_1302.15",1302,[274,967,1254,182]]]'>Henry St. John FitzGerald, of Arlington, Va., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
