  <article class="opinion" data-type="majority">
    <p id="A7bSL" data-blocks='[["BL_1302.10",1302,[1341,666,188,33]],["BL_1302.11",1302,[276,712,1255,183]]]'>Albert M. Wanninger, of Chicago, Ill., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
