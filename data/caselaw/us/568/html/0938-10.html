  <article class="opinion" data-type="majority">
    <p id="AKqK0" data-blocks='[["BL_1014.46",1014,[1283,2069,218,34]],["BL_1014.47",1014,[242,2113,1261,185]]]'>Godson M. Nnaka, of Baltimore, Md., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
