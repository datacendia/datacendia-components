  <article class="opinion" data-type="majority">
    <p id="AIg" data-blocks='[["BL_838.6",838,[1308,527,249,34]],["BL_838.7",838,[290,575,1267,186]]]'>John Michael Gassaway, of Oklahoma City, Okla., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
