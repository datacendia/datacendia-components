  <article class="opinion" data-type="majority">
    <p id="Aqct" data-blocks='[["BL_840.22",840,[1193,1578,350,42]],["BL_840.23",840,[281,1626,1264,186]]]'>Robert Ray Stone, of Arlington, Va., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
