    <h4 class="parties" id="Au0O" data-blocks='[["BL_833.20",833,[477,1434,640,35]]]'>In re Discipline of Ngobeni.</h4>

  <article class="opinion" data-type="majority">
    <p id="A8P" data-blocks='[["BL_833.21",833,[1159,1436,254,41]],["BL_833.22",833,[152,1481,1263,188]]]'>Paul Mpande Ngobeni, of Putnam, Conn., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
