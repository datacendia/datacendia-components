  <article class="opinion" data-type="majority">
    <p id="A5x" data-blocks='[["BL_841.5",841,[1075,355,338,41]],["BL_841.6",841,[145,404,1267,194]]]'>Navron Ponds, of Washington, D. C., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
