  <article class="opinion" data-type="majority">
    <p id="AjS" data-blocks='[["BL_833.9",833,[1142,631,270,34]],["BL_833.10",833,[148,678,1264,187]]]'>Michael Brian Gilland, of Towson, Md., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
