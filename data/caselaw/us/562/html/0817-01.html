    <p id="AZ7" data-blocks='[["BL_839.5",839,[1121,361,284,41]],["BL_839.6",839,[146,409,1261,188]]]'>Joseph Wayne Dean, of Raleigh, N. C., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
