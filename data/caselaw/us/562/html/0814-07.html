    <p id="Ai8" data-blocks='[["BL_836.30",836,[1189,2102,341,40]],["BL_836.31",836,[265,2149,1267,188]]]'>Michael H. Lubin, of North Miami Beach, Fla., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
