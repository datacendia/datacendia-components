  <article class="opinion" data-type="majority">
    <p id="Axh" data-blocks='[["BL_833.5",833,[1219,361,191,34]],["BL_833.6",833,[147,409,1264,187]]]'>Peter Michael Callegary, of Towson, Md., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
