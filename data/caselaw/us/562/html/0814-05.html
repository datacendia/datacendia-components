  <article class="opinion" data-type="majority">
    <p id="Agu9" data-blocks='[["BL_836.22",836,[1260,1580,271,41]],["BL_836.23",836,[263,1628,1270,187]]]'>Guy Burdette Bailey, Jr., of Miami, Fla., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
