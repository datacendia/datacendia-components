  <article class="opinion" data-type="majority">
    <p id="A_u" data-blocks='[["BL_831.21",831,[1183,1431,231,34]],["BL_831.22",831,[154,1476,1262,187]]]'>Leonard W. Krouner, of Albany, N. Y., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
