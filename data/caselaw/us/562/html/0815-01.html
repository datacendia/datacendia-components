    <p id="AqoY" data-blocks='[["BL_837.5",837,[1122,355,270,43]],["BL_837.6",837,[130,402,1262,188]]]'>William Craig Campbell II, of Saipan, N. Mar. I., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
