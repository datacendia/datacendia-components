  <article class="opinion" data-type="majority">
    <p id="AIR" data-blocks='[["BL_830.22",830,[1292,1040,209,34]],["BL_830.23",830,[236,1088,1267,183]]]'>Steven M. Woghin, of Cold Spring Harbor, N. Y., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
