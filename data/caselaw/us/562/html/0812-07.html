  <article class="opinion" data-type="majority">
    <p id="A3d" data-blocks='[["BL_834.30",834,[1331,2099,207,35]],["BL_834.31",834,[277,2148,1262,187]]]'>William A. Fitzpatrick, of Philadelphia, Pa., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
