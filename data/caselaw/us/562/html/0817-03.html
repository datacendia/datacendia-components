    <p class="docketnumber" id="b839-6" data-blocks='[["BL_839.11",839,[191,900,235,32]]]'>No. D-2562.</p>
    <h4 class="parties" id="Asi" data-blocks='[["BL_839.12",839,[469,898,703,33]]]'>In re Discipline of Radolovich.</h4>
  </section>
  <article class="opinion" data-type="majority">
    <p id="ATF" data-blocks='[["BL_839.13",839,[1215,898,194,34]],["BL_839.14",839,[151,945,1258,187]]]'>Ferdinand R. Radolovich, of Louisville, Ky., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
