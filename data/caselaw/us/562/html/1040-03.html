  </section>
  <article class="opinion" data-type="majority">
    <p id="ADad" data-blocks='[["BL_1062.14",1062,[1236,1039,299,34]],["BL_1062.15",1062,[273,1087,1263,183]]]'>William S. Lerach, of San Diego, Cal., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
