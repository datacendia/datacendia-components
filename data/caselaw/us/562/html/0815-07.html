  <article class="opinion" data-type="majority">
    <p id="AYA" data-blocks='[["BL_837.29",837,[1158,1969,239,34]],["BL_837.30",837,[137,2016,1262,185]]]'>R. Allen McCartney, of Louisville, Ky., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
