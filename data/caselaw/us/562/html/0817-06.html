  <article class="opinion" data-type="majority">
    <p id="Afb" data-blocks='[["BL_839.25",839,[1161,1705,250,41]],["BL_839.26",839,[154,1751,1259,186]]]'>Eric Tyrone Tolen, of St. Louis, Mo., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
