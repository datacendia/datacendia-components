  <article class="opinion" data-type="majority">
    <p id="Ay9" data-blocks='[["BL_840.14",840,[1217,1054,328,41]],["BL_840.15",840,[280,1102,1264,188]]]'>William Anthony Helm, of Bartlett, Tenn., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
