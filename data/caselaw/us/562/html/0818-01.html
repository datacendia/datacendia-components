  <article class="opinion" data-type="majority">
    <p id="AoPK" data-blocks='[["BL_840.6",840,[1189,532,356,42]],["BL_840.7",840,[280,580,1266,188]]]'>Daryll Boyd Jones, of Laurelton, N. Y., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
