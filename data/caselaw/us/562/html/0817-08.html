  <article class="opinion" data-type="majority">
    <p id="A2A" data-blocks='[["BL_839.33",839,[1110,2241,303,41]],["BL_839.34",839,[158,2288,1257,42]],["BL_840.1",840,[279,366,1266,140]]]'>Sigmund Victor Mazur, of Hyde Park, N. Y., is suspended from the practice of law <a id="p818" href="#p818" data-label="818" data-citation-index="1" class="page-label">*818</a>in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
