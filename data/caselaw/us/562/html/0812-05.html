  </section>
  <article class="opinion" data-type="majority">
    <p id="AQp0" data-blocks='[["BL_834.22",834,[1301,1579,238,33]],["BL_834.23",834,[274,1626,1267,189]]]'>Robert Alan Heghmann, of Darham, N. H., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
