  </section>
  <article class="opinion" data-type="majority">
    <p id="A9Q" data-blocks='[["BL_834.26",834,[1218,1840,318,42]],["BL_834.27",834,[275,1887,1268,180]]]'>Robert G. Udell, of Stuart, Fla., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
