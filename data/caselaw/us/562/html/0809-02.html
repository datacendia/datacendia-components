  <article class="opinion" data-type="majority">
    <p id="AlT" data-blocks='[["BL_831.9",831,[1138,625,274,42]],["BL_831.10",831,[150,672,1264,187]]]'>Hal J. Shaffer, of Cherry Hill, N. J., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
