  <article class="opinion" data-type="majority">
    <p id="AQf" data-blocks='[["BL_831.17",831,[1204,1162,209,41]],["BL_831.18",831,[152,1209,1263,185]]]'>Shelley A. Strasson, of West Bloomfield, Mich., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring her to show cause why she should not be disbarred from the practice of law in this Court.</p>
