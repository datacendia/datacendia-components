  <article class="opinion" data-type="majority">
    <p id="AjL" data-blocks='[["BL_837.9",837,[1061,623,332,43]],["BL_837.10",837,[130,672,1266,186]]]'>Samuel Regester Neel III, of Tallahassee, Fla., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
