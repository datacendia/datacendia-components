  <article class="opinion" data-type="majority">
    <p id="AC5l" data-blocks='[["BL_832.14",832,[1320,1053,205,34]],["BL_832.15",832,[262,1101,1269,184]]]'>Thomas J. Spargo, of East Berne, N. Y., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
