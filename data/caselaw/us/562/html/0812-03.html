  <article class="opinion" data-type="majority">
    <p id="A3S" data-blocks='[["BL_834.14",834,[1290,1059,248,34]],["BL_834.15",834,[274,1106,1264,185]]]'>Frederic Michael Brandes, of Timonium, Md., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
