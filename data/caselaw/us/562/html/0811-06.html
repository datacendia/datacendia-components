    <h4 class="parties" id="AcS" data-blocks='[["BL_833.24",833,[486,1702,741,35]]]'>In re Discipline of Deutchman.</h4>
  </section>
  <article class="opinion" data-type="majority">
    <p id="A3Lq" data-blocks='[["BL_833.25",833,[1273,1705,141,41]],["BL_833.26",833,[154,1749,1260,185]]]'>Murray Leonard Deutchman, of Rockville, Md., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
