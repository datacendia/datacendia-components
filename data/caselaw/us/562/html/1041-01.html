    <p id="A9fk" data-blocks='[["BL_1063.5",1063,[1206,358,216,42]],["BL_1063.6",1063,[158,405,1269,188]]]'>Stephen T. Mitchell, of New York, N. Y, is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
