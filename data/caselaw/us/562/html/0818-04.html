    <h4 class="parties" id="ANc" data-blocks='[["BL_840.17",840,[603,1318,614,33]]]'>In re Discipline of Moyler.</h4>
  </section>
  <article class="opinion" data-type="majority">
    <p id="AKp" data-blocks='[["BL_840.18",840,[1260,1318,283,34]],["BL_840.19",840,[281,1365,1263,187]]]'>James Edward Moyler, Jr., of Williamsburg, Va., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
