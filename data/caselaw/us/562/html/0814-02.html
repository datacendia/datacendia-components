    <p id="Ab5V" data-blocks='[["BL_836.10",836,[1249,800,283,34]],["BL_836.11",836,[263,847,1268,186]]]'>Leonard Udell Stolar, of Miami, Fla., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
