  <article class="opinion" data-type="majority">
    <p id="AcoV" data-blocks='[["BL_835.17",835,[1160,1168,257,34]],["BL_835.18",835,[158,1215,1260,187]]]'>Richard Paul Condon, of Kissimmee, Fla., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
