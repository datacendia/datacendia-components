  <section class="head-matter">
    <p class="docketnumber" id="b832-5" data-blocks='[["BL_832.4",832,[307,529,230,33]]]'>No. D-2508.</p>
    <h4 class="parties" id="A-M" data-blocks='[["BL_832.5",832,[582,529,597,34]]]'>In re Discipline of Munroe.</h4>
  </section>
  <article class="opinion" data-type="majority">
    <p id="AYX" data-blocks='[["BL_832.6",832,[1224,527,303,41]],["BL_832.7",832,[262,576,1267,186]]]'>Earl D. Munroe, of Saugus, Mass., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
  </article>
