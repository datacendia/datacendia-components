    <h4 class="parties" id="AuF" data-blocks='[["BL_840.25",840,[597,1839,668,33]]]'>In re Discipline of McPherson.</h4>
  </section>
  <article class="opinion" data-type="majority">
    <p id="AIZ8" data-blocks='[["BL_840.26",840,[1309,1838,235,42]],["BL_840.27",840,[281,1886,1268,189]]]'>Stephen Lee McPherson, of Chesapeake, Va., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
