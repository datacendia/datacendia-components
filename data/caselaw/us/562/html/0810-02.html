  <article class="opinion" data-type="majority">
    <p id="At2W" data-blocks='[["BL_832.10",832,[1226,789,300,42]],["BL_832.11",832,[262,837,1267,189]]]'>Alan J. Shweky, of New York, N. Y., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
