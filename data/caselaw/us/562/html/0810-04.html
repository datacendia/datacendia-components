  <article class="opinion" data-type="majority">
    <p id="AHs" data-blocks='[["BL_832.18",832,[1210,1312,317,42]],["BL_832.19",832,[263,1359,1266,187]]]'>Pieter J. DeJong, of Long Valley, N. J., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
