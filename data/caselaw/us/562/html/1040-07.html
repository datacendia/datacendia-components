  <article class="opinion" data-type="majority">
    <p id="Agyv" data-blocks='[["BL_1062.30",1062,[1213,2079,323,41]],["BL_1062.31",1062,[276,2127,1261,186]]]'>Stephen Edward Ford, of Algonquin, Ill., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
