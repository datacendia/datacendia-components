  <article class="opinion" data-type="majority">
    <p id="Aur" data-blocks='[["BL_838.30",838,[1272,2088,287,42]],["BL_838.31",838,[294,2138,1264,189]]]'>George Patrick Stanton, Jr., of Clarksburg, W. Va., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
