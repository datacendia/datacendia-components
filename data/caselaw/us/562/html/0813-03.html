  <article class="opinion" data-type="majority">
    <p id="AFj" data-blocks='[["BL_835.13",835,[1174,900,243,41]],["BL_835.14",835,[156,947,1266,186]]]'>Gary Robert DeFilippo, of Brooklyn, N. Y., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
