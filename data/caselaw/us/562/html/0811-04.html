  <article class="opinion" data-type="majority">
    <p id="ACik" data-blocks='[["BL_833.17",833,[1194,1169,218,34]],["BL_833.18",833,[151,1215,1266,186]]]'>Thomas M. Finneran, of Dorchester, Mass., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should mot be disbarred from the practice of law in this Court.</p>
