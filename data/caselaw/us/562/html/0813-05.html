  <article class="opinion" data-type="majority">
    <p id="A0z" data-blocks='[["BL_835.21",835,[1114,1437,303,34]],["BL_835.22",835,[159,1483,1260,186]]]'>Stuart Leonard Stein, of Santa Fe, N. M., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
