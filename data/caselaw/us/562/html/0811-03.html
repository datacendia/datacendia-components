    <h4 class="parties" id="AWe" data-blocks='[["BL_833.12",833,[467,898,589,34]]]'>In re Discipline of Pepyne.</h4>
  </section>
  <article class="opinion" data-type="majority">
    <p id="AgP" data-blocks='[["BL_833.13",833,[1103,899,309,42]],["BL_833.14",833,[148,946,1265,187]]]'>Edward Pepyne, Jr., of Greenfield, Mass., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
