  <article class="opinion" data-type="majority">
    <p id="AG-" data-blocks='[["BL_831.13",831,[1126,895,287,41]],["BL_831.14",831,[151,941,1264,185]]]'>Bruce Nicholls, of Gloucester, Mass., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
