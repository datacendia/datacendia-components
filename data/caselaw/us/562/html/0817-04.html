    <p class="docketnumber" id="b839-7" data-blocks='[["BL_839.15",839,[192,1168,244,33]]]'>No. D-2563.</p>
    <h4 class="parties" id="A56" data-blocks='[["BL_839.16",839,[481,1166,759,35]]]'>In re Discipline of Steinkrauss.</h4>
  </section>
  <article class="opinion" data-type="majority">
    <p id="AcC" data-blocks='[["BL_839.17",839,[1282,1167,129,42]],["BL_839.18",839,[151,1214,1260,186]]]'>Joseph Cosmas Steinkrauss, of Lexington, Mass., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
