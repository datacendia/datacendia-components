  <article class="opinion" data-type="majority">
    <p id="Adz" data-blocks='[["BL_831.25",831,[1252,1701,162,39]],["BL_831.26",831,[154,1745,1265,185]]]'>Mary C. Wickenkamp, of Denison, Tex., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring her to show cause why she should not be disbarred from the practice of law in this Court.</p>
