  <article class="opinion" data-type="majority">
    <p id="AlqY" data-blocks='[["BL_834.18",834,[1305,1318,232,33]],["BL_834.19",834,[273,1365,1266,188]]]'>Robert Lee Ehrlich, of Calabasas, Cal., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
