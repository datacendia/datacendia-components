    <p class="docketnumber" id="b836-5" data-blocks='[["BL_836.4",836,[307,538,235,34]]]'>No. D-2538.</p>
    <h4 class="parties" id="ARi" data-blocks='[["BL_836.5",836,[590,536,615,35]]]'>In re Discipline of Ziegler.</h4>
  </section>
  <article class="opinion" data-type="majority">
    <p id="ABg" data-blocks='[["BL_836.6",836,[1251,536,280,42]],["BL_836.7",836,[262,584,1270,188]]]'>Stephen Leonard Ziegler, of Fort Lauderdale, Fla., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
