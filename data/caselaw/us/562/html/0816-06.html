  <article class="opinion" data-type="majority">
    <p id="AjQI" data-blocks='[["BL_838.26",838,[1270,1832,287,33]],["BL_838.27",838,[292,1879,1266,186]]]'>Thomas Daniel Brown, of Charlotte, N. C., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
