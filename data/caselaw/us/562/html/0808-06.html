  <article class="opinion" data-type="majority">
    <p id="AYH" data-blocks='[["BL_830.26",830,[1142,1300,358,42]],["BL_830.27",830,[237,1349,1269,185]]]'>Daniel S. Orci, Jr., of St. Petersburg Beach, Fla., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
