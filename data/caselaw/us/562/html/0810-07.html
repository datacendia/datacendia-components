    <p class="docketnumber" id="b832-11" data-blocks='[["BL_832.28",832,[308,2096,234,33]]]'>No. D-2514.</p>
    <h4 class="parties" id="AZm" data-blocks='[["BL_832.29",832,[587,2093,653,34]]]'>In re Discipline of Bleecker.</h4>
  </section>
  <article class="opinion" data-type="majority">
    <p id="A-4R" data-blocks='[["BL_832.30",832,[1284,2094,244,40]],["BL_832.31",832,[264,2141,1265,189]]]'>Lorin Henry Bleecker, of Rockville, Md., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
