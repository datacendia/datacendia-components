    <h4 class="parties" id="A03b" data-blocks='[["BL_837.16",837,[446,1163,655,33]]]'>In re Discipline of Menyhart.</h4>
  </section>
  <article class="opinion" data-type="majority">
    <p id="AUTP" data-blocks='[["BL_837.17",837,[1146,1164,248,33]],["BL_837.18",837,[133,1210,1262,185]]]'>Andrew William Menyhart, of Merritt Island, Fla., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
