  <article class="opinion" data-type="majority">
    <p id="Aarc" data-blocks='[["BL_831.5",831,[1089,355,322,34]],["BL_831.6",831,[148,402,1265,188]]]'>Andrew M. Kim-mel, of Cedar Knolls, N. J., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.-</p>
