  </section>
  <article class="opinion" data-type="majority">
    <p id="Aap" data-blocks='[["BL_836.18",836,[1256,1318,276,33]],["BL_836.19",836,[263,1365,1272,188]]]'>Richard Brian Simring, of Miami Beach, Fla., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
