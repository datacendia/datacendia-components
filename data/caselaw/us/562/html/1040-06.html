    <p id="AX_D" data-blocks='[["BL_1062.26",1062,[1238,1820,298,41]],["BL_1062.27",1062,[274,1867,1263,187]]]'>Michael Wayne Ryan, Jr., of Bowie, Md., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
