  </section>
  <article class="opinion" data-type="majority">
    <p id="AURx" data-blocks='[["BL_837.21",837,[1112,1432,284,39]],["BL_837.22",837,[134,1477,1267,186]]]'>Myron Jerome Rayvis, of Palmetto Bay, Fla., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
