  <article class="opinion" data-type="majority">
    <p id="AV9N" data-blocks='[["BL_1063.9",1063,[1113,621,311,33]],["BL_1063.10",1063,[160,668,1269,185]]]'>Kathleen Kauth Trum, of Garden City, N. Y, is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring her to show cause why she should not be disbarred from the practice of law in this Court.</p>
