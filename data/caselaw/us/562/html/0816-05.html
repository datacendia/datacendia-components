  <article class="opinion" data-type="majority">
    <p id="AqE" data-blocks='[["BL_838.22",838,[1307,1573,249,33]],["BL_838.23",838,[292,1621,1266,184]]]'>Thomas Dale Grabinski, of Globe, Ariz., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
