  <article class="opinion" data-type="majority">
    <p id="ACO" data-blocks='[["BL_834.6",834,[1273,536,265,40]],["BL_834.7",834,[274,584,1266,187]]]'>Joel Chasnoff, of Ashton, Md., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
