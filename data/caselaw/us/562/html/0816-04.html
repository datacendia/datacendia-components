  <article class="opinion" data-type="majority">
    <p id="AIz" data-blocks='[["BL_838.18",838,[1252,1310,305,42]],["BL_838.19",838,[292,1357,1266,189]]]'>David Benjamin Stocker, of Phoenix, Ariz., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
