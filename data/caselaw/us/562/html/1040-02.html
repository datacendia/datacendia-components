  <article class="opinion" data-type="majority">
    <p id="Asny" data-blocks='[["BL_1062.10",1062,[1259,775,276,43]],["BL_1062.11",1062,[272,824,1267,186]]]'>Craig Monard Hunt, of San Francisco, Cal., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
