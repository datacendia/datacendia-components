    <h4 class="parties" id="ANt5" data-blocks='[["BL_1062.17",1062,[598,1298,627,33]]]'>In re Discipline of Cervizzi.</h4>
  </section>
  <article class="opinion" data-type="majority">
    <p id="A9jv" data-blocks='[["BL_1062.18",1062,[1270,1297,266,34]],["BL_1062.19",1062,[273,1345,1263,187]]]'>Richard Glennan Cervizzi, of Scarborough, Me., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
