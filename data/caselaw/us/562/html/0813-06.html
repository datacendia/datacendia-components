  </section>
  <article class="opinion" data-type="majority">
    <p id="Axi" data-blocks='[["BL_835.25",835,[1136,1705,282,41]],["BL_835.26",835,[160,1750,1261,186]]]'>James Harvey Tipler, of Mary Esther, Fla., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
