  <article class="opinion" data-type="majority">
    <p id="AZI" data-blocks='[["BL_834.10",834,[1254,799,286,42]],["BL_834.11",834,[273,846,1268,186]]]'>Michael Henry Ditton, of Bozeman, Mont., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
