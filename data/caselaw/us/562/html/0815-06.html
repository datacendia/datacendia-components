  <article class="opinion" data-type="majority">
    <p id="ABC" data-blocks='[["BL_837.25",837,[1248,1700,148,34]],["BL_837.26",837,[136,1747,1262,187]]]'>Richard Charles Bagdasarian, of Boca Raton, Fla., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
