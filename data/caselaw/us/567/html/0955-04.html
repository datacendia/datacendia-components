  <article class="opinion" data-type="majority">
    <p id="AzsP" data-blocks='[["BL_859.19",859,[1209,1291,191,33]],["BL_859.20",859,[139,1337,1266,182]]]'>Robert H. Smallenberg, of Ashland, Va., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
