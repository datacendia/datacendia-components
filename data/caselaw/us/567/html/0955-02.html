    <h4 class="parties" id="AjAg" data-blocks='[["BL_859.10",859,[467,756,718,34]]]'>In re Discipline of Hennessey.</h4>

  <article class="opinion" data-type="majority">
    <p id="A4OY" data-blocks='[["BL_859.11",859,[1226,757,173,33]],["BL_859.12",859,[140,802,1261,184]]]'>James J. Hennessey, Jr., of Albany, N. Y., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
