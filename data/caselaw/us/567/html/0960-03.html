  <article class="opinion" data-type="majority">
    <p id="ank-dedup-2" data-blocks='[["BL_864.13",864,[1177,876,320,39]],["BL_864.14",864,[235,923,1264,182]]]'>Jesse H. Ingram, of Columbia, Md., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
