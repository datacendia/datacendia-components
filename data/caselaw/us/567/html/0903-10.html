  <article class="opinion" data-type="majority">
    <p id="AzNd" data-blocks='[["BL_807.41",807,[1088,1435,324,40]],["BL_807.42",807,[153,1479,1261,182]]]'>Pieter J. DeJong, of Long Valley, N. J., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
