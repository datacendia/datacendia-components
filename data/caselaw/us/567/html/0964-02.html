    <p id="A3kl" data-blocks='[["BL_868.10",868,[1180,726,298,32]],["BL_868.11",868,[218,772,1265,187]]]'>Mark Lawrence Gitomer, of Reisterstown, Md., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
