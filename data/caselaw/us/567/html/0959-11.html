  <article class="opinion" data-type="majority">
    <p id="A-Ni" data-blocks='[["BL_863.46",863,[1138,2067,275,33]],["BL_863.47",863,[152,2112,1262,182]]]'>Trent William Mahler, of Milnor, N. D., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
