    <p id="A-D" data-blocks='[["BL_807.45",807,[1168,1694,246,41]],["BL_807.46",807,[153,1739,1264,181]]]'>Jeffrey Alan Bennett, of Doylestown, Pa., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
