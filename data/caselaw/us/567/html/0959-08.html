    <p id="aej-dedup-1" data-blocks='[["BL_863.34",863,[1130,1394,281,34]],["BL_863.35",863,[152,1441,1261,183]]]'>Juliette Alane House, of Crestwood, Ky., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring her to show cause why she should not be disbarred from the practice of law in this Court.</p>
