  <article class="opinion" data-type="majority">
    <p id="A-vH" data-blocks='[["BL_859.23",859,[1146,1556,256,33]],["BL_859.24",859,[139,1603,1263,181]]]'>Paul A. Gar-gano, of Cambridge, Mass., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
