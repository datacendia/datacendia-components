    <p class="docketnumber" id="b864-4" data-blocks='[["BL_864.3",864,[280,342,229,32]]]'>No. D-2687.</p>
    <h4 class="parties" id="ABTi" data-blocks='[["BL_864.4",864,[556,340,664,33]]]'>In re Discipline of Siegelman.</h4>
  </section>
  <article class="opinion" data-type="majority">
    <p id="Ag9A" data-blocks='[["BL_864.5",864,[1266,339,233,40]],["BL_864.6",864,[237,386,1262,187]]]'>Don Eugene Siegelman, of Birmingham, Ala., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
