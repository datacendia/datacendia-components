    <p id="Ahta" data-blocks='[["BL_1028.10",1028,[1212,755,351,42]],["BL_1028.11",1028,[316,801,1244,185]]]'>Philip M. King, of Mercer Island, Wash., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
