    <p class="docketnumber" id="b1010-6" data-blocks='[["BL_1010.8",1010,[351,771,219,33]]]'>No. D-2590.</p>
    <h4 class="parties" id="AqyU" data-blocks='[["BL_1010.9",1010,[616,772,589,33]]]'>In re Discipline of Pollack.</h4>
  </section>
  <article class="opinion" data-type="majority">
    <p id="Aofi" data-blocks='[["BL_1010.10",1010,[1250,772,300,33]],["BL_1010.11",1010,[308,818,1244,184]]]'>Ruth Marie Pollack, of Riverhead, N. Y., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring her to show cause why she should not be disbarred from the practice of law in this Court.</p>
