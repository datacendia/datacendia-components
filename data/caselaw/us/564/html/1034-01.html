  <article class="opinion" data-type="majority">
    <p id="Ah6k" data-blocks='[["BL_1028.6",1028,[1191,485,370,43]],["BL_1028.7",1028,[315,533,1246,183]]]'>Paul H. King, of La Union, Philippines, is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
