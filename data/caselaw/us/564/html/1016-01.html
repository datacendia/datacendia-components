    <h4 class="parties" id="ADDX" data-blocks='[["BL_1010.5",1010,[619,511,650,33]]]'>In re Discipline of Alderman.</h4>
  </section>
  <article class="opinion" data-type="majority">
    <p id="AqlX" data-blocks='[["BL_1010.6",1010,[1312,511,238,40]],["BL_1010.7",1010,[307,557,1248,185]]]'>Steven Boyd Alderman, of Syracuse, N. Y., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
