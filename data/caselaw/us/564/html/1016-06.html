  <article class="opinion" data-type="majority">
    <p id="AvKP" data-blocks='[["BL_1010.26",1010,[1348,1807,203,42]],["BL_1010.27",1010,[306,1853,1245,184]]]'>Barry Stephen Tabaehnick, of Folsom, Cal., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
