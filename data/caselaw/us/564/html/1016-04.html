    <h4 class="parties" id="Aexs" data-blocks='[["BL_1010.17",1010,[618,1292,616,33]]]'>In re Discipline of Kordell.</h4>
  </section>
  <article class="opinion" data-type="majority">
    <p id="Ac5v" data-blocks='[["BL_1010.18",1010,[1276,1293,275,33]],["BL_1010.19",1010,[307,1337,1245,183]]]'>James Michael Kordell, of Woodlake, Cal., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
