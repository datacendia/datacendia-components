  <article class="opinion" data-type="majority">
    <p id="A_M" data-blocks='[["BL_1011.9",1011,[1074,609,325,42]],["BL_1011.10",1011,[152,658,1245,188]]]'>Zoila I. Silva, of New York, N. Y., is suspended from the practice of law in this Court, and a rule will issue, returnable within 40 days, requiring him to show cause why he should not be disbarred from the practice of law in this Court.</p>
